name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: cargo test
        working-directory: src-tauri

      - run: pnpm tauri build --bundles nsis

      - name: Collect installer and portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe dist/
          Copy-Item src-tauri/target/release/dotacfg.exe "dist/Dota Config portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: dota-config-windows
          path: dist/*.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.exe
